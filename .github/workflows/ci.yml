name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show versions
        run: |
          pnpm -v
          node -v

      - name: Build (if present)
        run: pnpm -r build --if-present

      - name: Server tests
        run: pnpm --filter server test

      - name: Web typecheck
        run: pnpm --filter web tsc --noEmit















