<script>
    // Keep one idempotency key per browser (persists across refreshes)
    const IDEMP_KEY_STORAGE = 'proofai_idempotency_key';
    function getIdempotencyKey() {
      let k = localStorage.getItem(IDEMP_KEY_STORAGE);
      if (!k) {
        // simple 32-char hex
        k = 'demo-' + [...crypto.getRandomValues(new Uint8Array(16))]
          .map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem(IDEMP_KEY_STORAGE, k);
      }
      return k;
    }
  
    async function submitJob() {
      const prompt = document.getElementById('prompt').value || 'Hello ProofAI from the browser!';
      const body = { prompt, amountEth: "0.0001" };
  
      try {
        const res = await fetch('http://localhost:8080/jobs', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-idempotency-key': getIdempotencyKey()
          },
          body: JSON.stringify(body)
        });
  
        const out = document.getElementById('out');
        if (!res.ok) {
          const err = await res.text();
          out.textContent = `Error (${res.status}): ${err}`;
          return;
          }
        const json = await res.json();
        out.textContent = JSON.stringify(json, null, 2);
      } catch (e) {
        document.getElementById('out').textContent = 'Fetch error: ' + e;
      }
    }
  </script>
