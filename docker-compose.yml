services:
  redis:
    image: redis:7-alpine
    container_name: proofai-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: proofai-api
    environment:
      NODE_ENV: development
      PORT: "8080"
      SIGNING_MODE: client
      REDIS_URL: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

